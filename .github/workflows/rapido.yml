name: Coleta rápida (a cada 10 minutos)
# O agendamento do GitHub (cron) atrasa ou pula execuções em repositórios
# pouco movimentados. Por isso esta coleta roda em ciclo contínuo: uma mesma
# execução coleta a cada 10 minutos por cerca de 5 horas e meia e, ao terminar,
# dispara a si mesma de novo (workflow_dispatch com o GITHUB_TOKEN). No início
# de cada ciclo também dispara a coleta completa e a histórica, que assim rodam
# a cada ~6 horas mesmo se o cron delas falhar. O cron abaixo fica como reserva:
# se o ciclo parar, ele o reinicia (com concurrency, nunca roda em dobro).
# 10 minutos = até 144 publicações por dia na Vercel (plano Pro: limite de 6.000).
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta-rapida
  cancel-in-progress: false
jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      CICLOS: 40          # até 40 rodadas; o limite real é o tempo (5h20 por execução)
      INTERVALO: 600      # segundos entre o início de cada rodada (rodada mais longa: a próxima começa logo)
      DURACAO: 19200      # 5h20: depois disso não começa rodada nova e a execução dispara a seguinte
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar decodificador
        run: python -m pip install --quiet googlenewsdecoder pillow
      - name: Disparar coleta completa e histórica
        continue-on-error: true
        run: |
          gh workflow run coletar.yml --ref main || true
          gh workflow run historico.yml --ref main || true
          gh workflow run resolver_antigas.yml --ref main || true
      - name: Coletar a cada 10 minutos
        run: |
          set -uo pipefail
          comeco=$(date +%s)
          for ciclo in $(seq 1 "$CICLOS"); do
            inicio=$(date +%s)
            if [ $(( inicio - comeco )) -ge "$DURACAO" ]; then echo 'Tempo da execução esgotado; a próxima continua.'; break; fi
            echo "::group::Rodada $ciclo de $CICLOS ($(date -u +%H:%M) UTC)"
            git fetch -q origin main && git reset -q --hard origin/main
            if ! python acervo.py baixar; then echo 'Acervo indisponível; rodada pulada.'; echo '::endgroup::'; sleep 60; continue; fi
            antes=$(sha1sum noticias.json | cut -c1-40)
            python coletar_feeds_estaduais.py || echo 'Feeds com falha; seguindo.'
            # 15 sites por rodada: as 1.100+ fontes giram em ~1 dia.
            python coletor.py --limite-fontes 15 --limite-estados 4 --limite-fronteira 10 --limite-sites-fronteira 10 || echo 'Busca com falha; seguindo.'
            # Buscador alternativo (Bing Notícias): não depender só do Google. (GDELT recusa os servidores do GitHub: erro 429.)
            python buscadores.py --limite-bing 15 --resolver 60 || echo 'Buscadores alternativos com falha; seguindo.'
            # Google bloqueia o endereço deste servidor após algumas horas: depois de uma rodada
            # sem nenhum link recuperado, pausa 3 rodadas (a busca das antigas roda em outros servidores).
            if [ "${PAUSA_LINKS:-0}" -gt 0 ]; then
              PAUSA_LINKS=$((PAUSA_LINKS - 1)); echo "Links do Google em pausa (bloqueio); faltam $PAUSA_LINKS rodadas."
            else
              python recuperar_links.py --limite 600 --trabalhadores 4 --tempo-max 240 | tee /tmp/links.log || true
              grep -q '^Recuperados: 0/' /tmp/links.log && PAUSA_LINKS=3
            fi
            # Notícias novas primeiro; o restante relê páginas antigas (trecho de abertura, fotos).
            python ler_materias.py --limite 800 --trabalhadores 10 || true
            python hash_imagens.py --limite 600 --trabalhadores 16 || true  # fotos: duplicatas por imagem
            if [ "$(sha1sum noticias.json | cut -c1-40)" = "$antes" ]; then
              echo 'Nada novo nesta rodada.'
            elif python testes/test_duplicatas.py && python gerar_feed_site.py && python compactar_acervo.py; then
              python acervo.py salvar "Coleta rápida (rodada $ciclo)" buscadores_cursor.json feeds_saude.json || echo 'Falha ao salvar; a próxima rodada tenta de novo.'
            else
              echo 'Falha ao gerar o site; nada foi gravado nesta rodada.'
            fi
            echo '::endgroup::'
            [ "$ciclo" -lt "$CICLOS" ] || break
            espera=$(( INTERVALO - ($(date +%s) - inicio) ))
            [ "$espera" -gt 0 ] && sleep "$espera"
          done
      - name: Continuar o ciclo
        if: success() || failure()  # cancelado à mão = o ciclo para
        run: gh workflow run rapido.yml --ref main
