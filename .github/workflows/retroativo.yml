name: Coleta retroativa (mês a mês até 2006)
# Enche os meses anteriores ao início da coleta diária (out/2026), do mais recente para 2006:
# arquivo dos próprios veículos (WordPress, link direto e foto), Google Notícias semana a semana
# (estados, temas, polos de fronteira), links, leitura das matérias, fotos e duplicatas.
# Os mesmos padrões das outras coletas: robots.txt, veículos pagos fora, duplicatas (texto,
# operação, foto inteira ou recortada, auditor), nada sem foto e sem conteúdo no site.
# Um mês por vez; o cursor (retroativo_cursor.json) só passa ao mês anterior quando o mês terminou.
# Ao terminar, dispara a si mesma (o cron fica de reserva).
# Quatro frentes em paralelo (input faixa), cada uma com o próprio cursor e o próprio período:
# a = 2025-2022 (retroativo_cursor.json), f = 2021, b = 2020-2016, c = 2015-2011, d = 2010-2006,
# e = nov e out/2026 (o começo da coleta diária, com menos notícias que os outros meses de 2026)
# (retroativo_cursor_<faixa>.json). Cada ano tem a sua parte do acervo: as frentes não se atrapalham.
on:
  workflow_dispatch:
    inputs:
      faixa:
        description: 'Frente: a (2025-2022), f (2021), b (2020-2016), c (2015-2011), d (2010-2006), e (nov-out/2026: completa o início da coleta diária)'
        required: false
        default: 'a'
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta-retroativa-${{ inputs.faixa || 'a' }}
  cancel-in-progress: false
jobs:
  retroativo:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ github.token }}
      FAIXA: ${{ inputs.faixa || 'a' }}
      CURSOR: ${{ (inputs.faixa || 'a') == 'a' && 'retroativo_cursor.json' || format('retroativo_cursor_{0}.json', inputs.faixa) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet googlenewsdecoder pillow numpy
      - name: Mês da vez
        id: c
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          c = json.load(open(os.environ['CURSOR']))
          # Limite de cada frente (o mês mais antigo que ela coleta).
          c['ate'] = {'a': '2022-01', 'f': '2021-01', 'b': '2016-01', 'c': '2011-01', 'd': '2006-01', 'e': '2026-10'}[os.environ['FAIXA']]
          print(f"mes={c['mes']}")
          print(f"ano={c['mes'][:4]}")
          print(f"wp={'sim' if c.get('arquivo_sites_feito') else 'nao'}")
          print(f"pular={c.get('google_feitas', 0)}")
          print(f"extra={'sim' if c.get('passada', 1) == 2 else 'nao'}")
          print(f"oficiais={'sim' if c['mes'].endswith('-12') and c.get('passada', 1) == 1 and not c.get('arquivo_sites_feito') else 'nao'}")
          import os
          # Pausa manual (arquivo retroativo_pausa no repositório): não coleta nem dispara a seguinte.
          print(f"fim={'sim' if c['mes'] < c['ate'] or os.path.exists('retroativo_pausa') else 'nao'}")
          PY
      - name: Baixar a parte do acervo deste mês (release "dados")
        if: steps.c.outputs.fim == 'nao'
        run: python acervo.py baixar --parte "$(python acervo.py parte-de ${{ steps.c.outputs.mes }})"
      - name: Arquivo dos sites dos veículos (WordPress)
        if: steps.c.outputs.fim == 'nao' && steps.c.outputs.wp == 'nao'
        continue-on-error: true
        run: python arquivo_sites.py --mes ${{ steps.c.outputs.mes }} --tempo-max 2700 ${{ steps.c.outputs.extra == 'sim' && '--extra' || '' }}
      - name: Google Notícias semana a semana
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python coletor.py --retroativo ${{ steps.c.outputs.mes }} --pular ${{ steps.c.outputs.pular }} ${{ steps.c.outputs.extra == 'sim' && '--extra' || '' }}
      - name: Arquivos oficiais do ano (PF, PRF, Receita; uma vez por ano)
        if: steps.c.outputs.fim == 'nao' && steps.c.outputs.oficiais == 'sim' && steps.c.outputs.ano >= 2015
        continue-on-error: true
        run: python coletar_fontes_diretas.py --ano ${{ steps.c.outputs.ano }} --paginas 12
      - name: Link original (notícias do ano)
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python recuperar_links.py --periodo ${{ steps.c.outputs.ano }} --antigas --limite 2000 --trabalhadores 4 --tempo-max 1500
      - name: Ler as matérias do ano (foto, trecho, fatos)
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python ler_materias.py --periodo ${{ steps.c.outputs.ano }} --limite 3000 --trabalhadores 10
      - name: Fotos (impressão digital, recortes)
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python hash_imagens.py --periodo ${{ steps.c.outputs.ano }} --limite 4000 --trabalhadores 16
      - name: Gerar o site
        if: steps.c.outputs.fim == 'nao'
        run: |
          python testes/test_duplicatas.py
          python gerar_feed_site.py
          python compactar_acervo.py
      - name: Avançar o cursor
        if: steps.c.outputs.fim == 'nao'
        run: |
          python - <<'PY'
          import json, os
          c = json.load(open(os.environ['CURSOR']))
          c['arquivo_sites_feito'] = True
          g = json.load(open('retroativo_google.json')) if os.path.exists('retroativo_google.json') else {}
          c['google_tentativas'] = c.get('google_tentativas', 0) + 1
          if g.get('mes') == c['mes']:
              c['google_feitas'] = g.get('feitas', c.get('google_feitas', 0))
          # Mês concluído: Google terminou (ou 4 tentativas com bloqueio) e arquivo dos sites feito.
          if g.get('completo') or c['google_tentativas'] >= 4:
              from metas_cobertura import meta_mes, publicadas_no_mes
              feito = publicadas_no_mes(json.load(open('feed.json')), c['mes'])
              meta = meta_mes(c['mes'][:4])
              print(f"{c['mes']}: {feito} notícias publicadas (meta {meta}); passada {c.get('passada', 1)}")
              c.setdefault('resultado', {})[c['mes']] = {'publicadas': feito, 'meta': meta, 'passada': c.get('passada', 1)}
              if feito < meta and c.get('passada', 1) == 1:
                  # Abaixo da meta: segunda passada com termos específicos.
                  c.update(passada=2, arquivo_sites_feito=False, google_feitas=0, google_tentativas=0)
              else:
                  c.setdefault('meses_concluidos', []).append(c['mes'])
                  a, m = map(int, c['mes'].split('-'))
                  a, m = (a - 1, 12) if m == 1 else (a, m - 1)
                  c.update(mes=f'{a}-{m:02d}', passada=1, arquivo_sites_feito=False, google_feitas=0, google_tentativas=0)
          json.dump(c, open(os.environ['CURSOR'], 'w'), ensure_ascii=False, indent=1)
          print('Cursor:', c['mes'], '| concluídos:', len(c['meses_concluidos']))
          PY
      - name: Salvar (mescla se outra coleta gravou antes)
        if: steps.c.outputs.fim == 'nao'
        run: |
          python acervo.py salvar "Coleta retroativa ($FAIXA) - ${{ steps.c.outputs.mes }}" "$CURSOR" arquivo_sites_estado.json
      - name: Continuar com o mês seguinte (o agendamento do GitHub falha às vezes)
        if: (success() || failure()) && steps.c.outputs.fim == 'nao'
        run: gh workflow run retroativo.yml --ref main -f faixa="$FAIXA"
