name: Juiz de duplicatas (IA própria)
# Um modelo de IA aberto (Qwen2.5, roda aqui mesmo, sem chave paga) lê os pares que o auditor
# deixou em dúvida (duplicatas_suspeitas.json) e decide se são o mesmo fato.
# 1. Calibração (sempre que o juiz, o modelo ou os casos mudam; e a cada 7 dias): os casos conferidos à mão
#    (testes/juiz_casos.json) são julgados em 4 partes paralelas; se o juiz juntar algum par
#    diferente, a versão é reprovada e nada é julgado (juiz_calibracao.json).
# 2. Julgamento: 4 juízes em paralelo (6 enquanto a fila passar de 150 pares), cada um com a sua fatia dos pares e o seu arquivo
#    (juiz_decisoes_<n>.json). Pares novos primeiro (os recentes na frente); depois os que uma
#    versão anterior deixou em dúvida. As decisões valem na próxima geração do site (10 minutos).
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      so_calibrar:
        description: 'Só rodar a calibração (não julga)'
        type: boolean
        default: false
      modelo:
        description: 'Modelo: 14b (mais preciso) ou 7b (mais rápido)'
        type: choice
        options: ['14b', '7b']
        default: '14b'
permissions:
  contents: write
  actions: write  # chamar a próxima rodada
concurrency:
  group: juiz-duplicatas
  cancel-in-progress: false
env:
  MODELO_REPO: ${{ (inputs.modelo || '14b') == '7b' && 'bartowski/Qwen2.5-7B-Instruct-GGUF' || 'bartowski/Qwen2.5-14B-Instruct-GGUF' }}
  MODELO_ARQ: ${{ (inputs.modelo || '14b') == '7b' && 'Qwen2.5-7B-Instruct-Q4_K_M.gguf' || 'Qwen2.5-14B-Instruct-Q4_K_M.gguf' }}
  GH_TOKEN: ${{ github.token }}
jobs:
  situacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      calibrar: ${{ steps.s.outputs.calibrar }}
      estado: ${{ steps.s.outputs.estado }}
      juizes: ${{ steps.f.outputs.juizes }}
      fatias: ${{ steps.f.outputs.fatias }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: s
        run: |
          r=$(python juiz_duplicatas.py --situacao-calibracao --modelo "$MODELO_ARQ")
          echo "$r"
          echo "estado=${r#CALIBRACAO=}" >> "$GITHUB_OUTPUT"
          # Reprovada nesta mesma versão: não recalibra nem julga (aguarda correção do juiz).
          if [ "${{ inputs.so_calibrar }}" = "true" ] || [ "$r" = "CALIBRACAO=precisa" ]; then echo calibrar=sim >> "$GITHUB_OUTPUT"; else echo calibrar=nao >> "$GITHUB_OUTPUT"; fi
      # Fila grande (mais de 150 pares): 6 juízes; senão, 4 (sobra vaga para a coleta no GitHub).
      - id: f
        run: |
          python juiz_duplicatas.py --so-contar --modelo "$MODELO_ARQ" | tee contagem.txt
          echo "juizes=$(grep '^JUIZES=' contagem.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "fatias=$(grep '^FATIAS=' contagem.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  calibrar:
    needs: situacao
    if: needs.situacao.outputs.calibrar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/acoes/modelo-juiz
      - name: Calibração (parte ${{ matrix.parte }} de 4)
        run: python juiz_duplicatas.py --modelo ~/modelo/"$MODELO_ARQ" --so-calibrar --threads 4 --shard ${{ matrix.parte }} --shards 4 --saida cal_${{ matrix.parte }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: calibracao-${{ matrix.parte }}
          path: cal_${{ matrix.parte }}.json

  aprovar:
    needs: calibrar
    if: ${{ !cancelled() && needs.calibrar.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibracao-*
          merge-multiple: true
      - name: Aprovar ou reprovar a versão do juiz
        run: |
          python juiz_duplicatas.py --modelo "$MODELO_ARQ" --aprovar cal_0.json cal_1.json cal_2.json cal_3.json
          python acervo.py salvar --sem-dados 'Calibração do juiz de duplicatas (IA)' juiz_calibracao.json

  juiz:
    needs: [situacao, aprovar]
    if: ${{ !cancelled() && !inputs.so_calibrar && needs.situacao.result == 'success' && needs.aprovar.result != 'failure' && needs.situacao.outputs.estado != 'reprovada' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fatia: ${{ fromJSON(needs.situacao.outputs.fatias || '[0, 1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # pega a calibração gravada agora
      - uses: ./.github/acoes/modelo-juiz
      - name: Julgar os pares em dúvida (fatia ${{ matrix.fatia }})
        run: python juiz_duplicatas.py --modelo ~/modelo/"$MODELO_ARQ" --tempo-max 3000 --threads 4 --shard ${{ matrix.fatia }} --shards ${{ needs.situacao.outputs.juizes || 4 }}
      - name: Gravar as decisões
        run: python acervo.py salvar --sem-dados "Juiz de duplicatas (IA, fatia ${{ matrix.fatia }})" juiz_decisoes_${{ matrix.fatia }}.json

  # O agendamento do GitHub falha com frequência: o juiz chama a próxima rodada sozinho
  # (a concorrência impede duas ao mesmo tempo). Sem pares, espera 20 min antes.
  proxima:
    needs: juiz
    if: ${{ needs.juiz.result == 'success' && !inputs.so_calibrar }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Próxima rodada
        run: |
          git pull -q origin main || true
          if python juiz_duplicatas.py --so-contar --modelo "$MODELO_ARQ" | grep -q '^PENDENTES=0$'; then sleep 1200; fi
          gh workflow run juiz_duplicatas.yml --ref main -f modelo="${{ inputs.modelo || '14b' }}"
