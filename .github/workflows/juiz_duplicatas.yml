name: Juiz de duplicatas (IA própria)
# Um modelo de IA aberto (Qwen2.5 7B, roda aqui mesmo, sem chave paga) lê os pares que o
# auditor deixou em dúvida (duplicatas_suspeitas.json) e decide se são o mesmo fato.
# Antes de decidir, passa pela calibração com pares conferidos à mão (testes/juiz_casos.json):
# se juntar algum par diferente, nada é gravado. Quatro juízes trabalham em paralelo, cada um
# com a sua fatia dos pares e o seu arquivo (juiz_decisoes_<n>.json); as decisões valem na
# próxima geração do site (coleta rápida, a cada 10 minutos). Pares recentes são julgados primeiro.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      so_calibrar:
        description: 'Só rodar a calibração (não grava decisões)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write  # chamar a próxima rodada
concurrency:
  group: juiz-duplicatas
  cancel-in-progress: false
jobs:
  juiz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fatia: ${{ fromJSON(inputs.so_calibrar && '[0]' || '[0, 1, 2, 3]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      MODELO_REPO: bartowski/Qwen2.5-7B-Instruct-GGUF
      MODELO_ARQ: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Motor compilado em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-llama-cpp-0.3.2-generico
      - name: Instalar o motor do modelo (CPU; compilado aqui na primeira vez)
        env:
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON'
        run: |
          python -m pip install --quiet huggingface_hub==0.26.2
          python -m pip install "llama-cpp-python==0.3.2" --no-binary llama-cpp-python
      - name: Modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/modelo
          key: modelo-${{ env.MODELO_ARQ }}
      - name: Baixar o modelo (primeira vez)
        run: |
          if [ ! -f ~/modelo/"$MODELO_ARQ" ]; then
            python -c "from huggingface_hub import hf_hub_download as h; import os; h(os.environ['MODELO_REPO'], os.environ['MODELO_ARQ'], local_dir=os.path.expanduser('~/modelo'))"
          fi
          ls -la ~/modelo
      - name: Calibração (uma vez por dia) e julgamento dos pares em dúvida
        run: |
          if [ "${{ inputs.so_calibrar }}" = "true" ]; then
            python juiz_duplicatas.py --modelo ~/modelo/"$MODELO_ARQ" --calibrar testes/juiz_casos.json --so-calibrar
          else
            python juiz_duplicatas.py --modelo ~/modelo/"$MODELO_ARQ" --calibrar testes/juiz_casos.json --tempo-max 2400 --shard ${{ matrix.fatia }} --shards 4
          fi
      - name: Gravar as decisões
        if: ${{ !inputs.so_calibrar }}
        run: python acervo.py salvar --sem-dados "Juiz de duplicatas (IA, fatia ${{ matrix.fatia }})" juiz_decisoes_${{ matrix.fatia }}.json
  # O agendamento do GitHub falha com frequência: o juiz chama a próxima rodada sozinho
  # (a concorrência impede duas ao mesmo tempo). Sem pares novos, espera 20 min antes.
  proxima:
    needs: juiz
    if: ${{ needs.juiz.result == 'success' && !inputs.so_calibrar }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Próxima rodada
        run: |
          git pull -q origin main || true
          if python juiz_duplicatas.py --so-contar | grep -q '^PENDENTES=0$'; then sleep 1200; fi
          gh workflow run juiz_duplicatas.yml --ref main
