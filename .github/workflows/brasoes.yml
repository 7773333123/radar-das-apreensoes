name: Brasões oficiais (manual)
# Baixa os brasões das instituições (Wikidata/Wikimedia Commons) para img/brasoes/.
# As imagens são conferidas à mão antes de o site passar a usá-las (assets/brasoes.js).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brasoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python baixar_brasoes.py
      - name: Gravar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/brasoes assets/brasoes.js
          git diff --cached --quiet && exit 0
          git commit -q -m 'Brasões oficiais das instituições'
          for k in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((k*3)); done
          exit 1
