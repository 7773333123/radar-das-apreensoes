name: Revisão completa das fotos (mesma foto com recorte/zoom)
# Passa o acervo inteiro de uma parte (quente = últimos 45 dias, ou um ano) pela comparação de
# fotos por pontos característicos (fotos_orb.py --revisar): acha a mesma foto recortada, com
# zoom ou em outro tamanho, mesmo com títulos genéricos, e regenera o site da parte. Retoma de
# onde parou e chama a si mesma até terminar; depois segue para a parte seguinte da fila e,
# no fim da fila, para o ano anterior, até 2006 (o acervo inteiro).
on:
  workflow_dispatch:
    inputs:
      partes:
        description: 'Partes a revisar, em ordem (separadas por espaço)'
        default: 'quente 2026 2025'
permissions:
  contents: write
  actions: write
concurrency:
  group: revisao-fotos
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - id: p
        name: Parte desta execução
        run: |
          set -- ${{ inputs.partes }}
          echo "parte=$1" >> "$GITHUB_OUTPUT"
          shift; echo "resto=$*" >> "$GITHUB_OUTPUT"
      - name: Baixar a parte do acervo
        run: python acervo.py baixar --parte "${{ steps.p.outputs.parte }}"
      - name: Comparar as fotos (dia a dia, retoma de onde parou)
        run: python fotos_orb.py --revisar 2000-01-01:9999-12-31 --trabalhadores 16 --tempo-max 15000 | tee revisao.log
      - name: Gerar o site da parte e gravar
        run: |
          python testes/test_duplicatas.py
          python gerar_feed_site.py
          python compactar_acervo.py
          python acervo.py salvar "Revisão das fotos (${{ steps.p.outputs.parte }})"
      - name: Continuar (mesma parte ou a próxima)
        if: success()
        run: |
          if grep -q 'tempo esgotado' revisao.log; then
            gh workflow run revisao_fotos.yml --ref main -f partes="${{ inputs.partes }}"
          elif [ -n "${{ steps.p.outputs.resto }}" ]; then
            gh workflow run revisao_fotos.yml --ref main -f partes="${{ steps.p.outputs.resto }}"
          else
            # Fim da lista: segue sozinho para o ano anterior, até 2006 (acervo inteiro).
            parte="${{ steps.p.outputs.parte }}"
            case "$parte" in
              quente) proxima=2026 ;;
              *) proxima=$(( parte - 1 )) ;;
            esac
            if [ "$proxima" -ge 2006 ]; then
              gh workflow run revisao_fotos.yml --ref main -f partes="$proxima"
            else
              echo 'Revisão das fotos concluída no acervo inteiro (2006 a hoje).'
            fi
          fi
