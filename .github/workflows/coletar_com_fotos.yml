name: Recuperar fotos das fontes

on:
  workflow_dispatch:
    inputs:
      ano_historico:
        description: 'Ano historico para coleta opcional (deixe vazio para coleta normal)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar noticias
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          if [ -n "$ANO_HISTORICO" ]; then
            case "$ANO_HISTORICO" in
              2020|2021|2022|2023|2024|2025|2026|2027|2028|2029|2030) ;;
              *) echo 'Ano invalido'; exit 1 ;;
            esac
            python coletor.py --historico --ano "$ANO_HISTORICO"
          else
            python coletor.py
          fi

      - name: Coletar arquivos oficiais diretamente (2020 em diante)
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          if [ -n "$ANO_HISTORICO" ]; then
            python coletar_fontes_diretas.py --ano "$ANO_HISTORICO" --paginas 2
          else
            python coletar_fontes_diretas.py --paginas 2
          fi

      - name: Buscar fotos reais nas fontes
        run: python enriquecer_fotos_fontes.py --limite 60

      - name: Analisar noticias e gerar estatisticas
        run: python analisar_noticias.py

      - name: Salvar noticias e analise sem conflitos
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for tentativa in 1 2 3; do
            echo "Tentativa de salvamento $tentativa/3"
            git add noticias.json analise_nacional.json cobertura_historica.json
            if git diff --cached --quiet; then
              echo 'Nenhuma alteração a salvar.'
              exit 0
            fi
            git commit -m 'Atualizar noticias e estatisticas automaticamente'
            if git push origin HEAD:main; then
              echo 'Acervo atualizado com sucesso.'
              exit 0
            fi
            echo 'Outra atualização foi salva. Recarregando acervo mais recente e repetindo a coleta sem apagar registros remotos.'
            git fetch origin main
            git reset --hard origin/main
            if [ -n "$ANO_HISTORICO" ]; then
              python coletor.py --historico --ano "$ANO_HISTORICO"
              python coletar_fontes_diretas.py --ano "$ANO_HISTORICO" --paginas 2
            else
              python coletor.py
              python coletar_fontes_diretas.py --paginas 2
            fi
            python enriquecer_fotos_fontes.py --limite 60
            python analisar_noticias.py
          done
          echo 'Não foi possível salvar após 3 tentativas. Nenhum push forçado foi realizado.' >&2
          exit 1
