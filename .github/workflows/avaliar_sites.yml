name: Avaliar sites candidatos (manual)
on:
  workflow_dispatch:
    inputs:
      lista:
        description: 'Arquivo de candidatos'
        default: 'candidatos_sites.json'
jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/avaliar_sites.py 9999 "${{ inputs.lista }}"
      - uses: actions/upload-artifact@v4
        with:
          name: avaliacao_sites
          path: avaliacao_sites.json
