name: Coleta pelo Wayback Machine (2016 a 2006)
# Notícias de apreensão que sumiram dos sites e do Google: cópias guardadas no archive.org.
# Um servidor por ano, todos em paralelo (o índice do archive.org limita a velocidade por servidor):
# sem "ano", esta execução só dispara os anos ainda não terminados; com "ano", coleta esse ano por
# ~100 minutos (portais oficiais antigos primeiro, depois os 250 veículos que mais publicam), lê as
# matérias, gera o site do ano, grava e dispara a si mesma de novo até o ano terminar
# (wayback.py, cursor wayback_cursor_AAAA.json). Cron de reserva relança os anos parados.
on:
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano (vazio = dispara todos os anos não terminados, 2016 a 2006)'
        required: false
        default: ''
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta-wayback-${{ inputs.ano || 'lancar' }}
  cancel-in-progress: false
jobs:
  lancar:
    if: ${{ !inputs.ano }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Disparar um servidor por ano
        run: |
          for ano in $(seq 2016 -1 2006); do
            fim=$(python3 -c "import json,os; f='wayback_cursor_$ano.json'; print(json.load(open(f)).get('${ano}_fim', False) if os.path.exists(f) else False)")
            if [ "$fim" = "True" ]; then echo "$ano: terminado"; continue; fi
            gh workflow run wayback.yml --ref main -f ano=$ano && echo "$ano: disparado"
            sleep 2
          done
  wayback:
    if: ${{ inputs.ano }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ github.token }}
      ANO: ${{ inputs.ano }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet googlenewsdecoder pillow numpy
      - name: Ano terminado?
        id: c
        run: |
          python3 -c "import json,os; f='wayback_cursor_$ANO.json'; print('fim=' + ('sim' if os.path.exists(f) and json.load(open(f)).get('${ANO}_fim') else 'nao'))" >> "$GITHUB_OUTPUT"
      - name: Baixar a parte do acervo do ano (release "dados")
        if: steps.c.outputs.fim == 'nao'
        run: python acervo.py baixar --parte "$(python acervo.py parte-de $ANO-06)"
      - name: Wayback Machine
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python wayback.py --ano $ANO --tempo-max 6000
      - name: Ler as matérias do ano (foto, trecho, fatos)
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python ler_materias.py --periodo $ANO --limite 2000 --trabalhadores 8
      - name: Fotos (impressão digital, recortes)
        if: steps.c.outputs.fim == 'nao'
        continue-on-error: true
        run: python hash_imagens.py --periodo $ANO --limite 3000 --trabalhadores 16
      - name: Gerar o site
        if: steps.c.outputs.fim == 'nao'
        run: |
          python testes/test_duplicatas.py
          python gerar_feed_site.py
          python compactar_acervo.py
      - name: Salvar (mescla se outra coleta gravou antes)
        if: steps.c.outputs.fim == 'nao'
        run: python acervo.py salvar "Coleta Wayback Machine - $ANO" wayback_cursor_$ANO.json
      - name: Continuar o ano (o agendamento do GitHub falha às vezes)
        if: (success() || failure()) && steps.c.outputs.fim == 'nao'
        run: gh workflow run wayback.yml --ref main -f ano=$ANO
