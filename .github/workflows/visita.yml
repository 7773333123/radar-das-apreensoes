name: Visitantes do site
# Recebe de api/visita.js (repository_dispatch) país, estado e cidade aproximados de cada visitante
# (uma vez por dia por navegador, sem IP) e acrescenta ao ramo "visitas" em visitas/AAAA-MM-DD.jsonl.
# O ramo "visitas" não é publicado (a Vercel só publica main) e não dispara publicação do site.
on:
  repository_dispatch:
    types: [visita, teste-visita]
permissions:
  contents: write
concurrency:
  group: visitantes
  cancel-in-progress: false
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Teste da chave (não grava nada)
        if: github.event.action == 'teste-visita'
        run: echo 'Chave da Vercel funcionando. País no teste:' '${{ github.event.client_payload.pais }}'
      - uses: actions/checkout@v5
        if: github.event.action == 'visita'
        with:
          fetch-depth: 0
      - name: Acrescentar ao ramo visitas
        if: github.event.action == 'visita'
        env:
          VISITA: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin visitas >/dev/null; then
            git fetch -q origin visitas && git checkout -q -B visitas origin/visitas
          else
            git checkout -q --orphan visitas && git rm -rq --cached . && git clean -fdq
            printf 'Visitantes do Radar das Apreensões: país, estado e cidade aproximados, sem IP. Não publicado no site.\n' > LEIAME.txt
            git add LEIAME.txt
          fi
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          v = json.loads(os.environ['VISITA'])
          quando = str(v.get('quando') or datetime.now(timezone.utc).isoformat()[:16] + 'Z')
          dia = (datetime.fromisoformat(quando.replace('Z', '+00:00')) - timedelta(hours=3)).date().isoformat()
          os.makedirs('visitas', exist_ok=True)
          linha = {k: str(v.get(k, ''))[:120] for k in ('pais', 'codigo_pais', 'estado', 'cidade', 'quando')}
          with open(f'visitas/{dia}.jsonl', 'a', encoding='utf-8') as f:
              f.write(json.dumps(linha, ensure_ascii=False) + '\n')
          print(dia, linha)
          PY
          git add visitas
          git commit -qm "Visitante $(date -u +%H:%M) UTC"
          for t in 1 2 3 4 5; do git push -q origin HEAD:visitas && break; git pull -q --rebase origin visitas; sleep 3; done
