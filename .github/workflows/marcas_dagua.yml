name: Fotos com marca d'água (aprender e conferir)
# Regra do dono (24/11/2026): nada de marca d'água ou nome de jornal nas fotos do site.
# Aprende onde cada veículo carimba a marca (bordas que se repetem nos mesmos pixels em fotos
# diferentes) e confere as fotos recentes dos veículos com marca. O site troca a foto carimbada
# pela foto limpa de outra fonte da mesma notícia ou mostra o marcador da editoria.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      fontes:
        description: 'Veículos a aprender nesta rodada'
        required: false
        default: '500'
      diagnostico:
        description: 'Só calibrar: veículos separados por vírgula (não grava nada)'
        required: false
        default: ''
permissions:
  contents: write
# Grupo próprio: a regeneração de todos os anos (publicar-site) leva horas e travava esta rotina na fila.
# acervo.py salvar já junta gravações simultâneas (como a coleta expressa faz).
concurrency:
  group: marcas-dagua
  cancel-in-progress: false
jobs:
  marcas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Testes
        run: python testes/test_marcas_dagua.py
      - name: Baixar o acervo (release "dados")
        run: python acervo.py baixar
      - name: Diagnóstico (só calibração)
        if: inputs.diagnostico != ''
        run: python marcas_dagua.py --diagnostico "${{ inputs.diagnostico }}"
      - name: Aprender as marcas e conferir as fotos recentes
        if: inputs.diagnostico == ''
        run: python marcas_dagua.py --aprender --fontes "${{ inputs.fontes || '500' }}" --marcar --dias 10 --limite 6000
      - name: Regenerar e salvar
        if: inputs.diagnostico == ''
        run: |
          python testes/test_duplicatas.py
          python gerar_feed_site.py > /tmp/gerar.log
          grep -i "marca" /tmp/gerar.log || true
          python compactar_acervo.py
          python acervo.py salvar "Fotos com marca d'água" marcas_dagua.json
