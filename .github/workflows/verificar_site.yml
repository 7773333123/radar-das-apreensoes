name: Verificar o site no ar
# Diagnóstico manual: mostra status, redirecionamentos e conteúdo de endereços
# do site publicado (com e sem www).
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Endereços a testar (separados por espaço); vazio = os de produção'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  deployments: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir endereços
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          # Página de notícia: a mais nova da faixa Agora (um id que existe de verdade).
          id=$(curl -sS https://www.radardasapreensoes.com.br/agora.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["noticias"][0]["i"])' || echo 0)
          for host in ${HOSTS:-radardasapreensoes.com.br www.radardasapreensoes.com.br radar-das-apreensoes.vercel.app}; do
            for caminho in / /google07199f6dab12c6a3.html /sitemap.xml /observatorio /noticia/$id /estado/MT /relatorios /sobre /feed.json /agora.json /det/7.json /assets/central.js; do
              echo "=== https://$host$caminho"
              curl -sS -o /tmp/corpo -D - -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "https://$host$caminho" | grep -iE '^(HTTP|location|content-type|x-vercel-cache)' || true
              head -c 160 /tmp/corpo | tr '\n' ' '; echo
            done
          done
      - name: Atraso da faixa Agora (coleta x site no ar)
        run: |
          curl -sS "https://www.radardasapreensoes.com.br/agora.json?t=$(date +%s)" | python3 -c '
          import json,sys,datetime as dt
          d=json.load(sys.stdin); agora=dt.datetime.now(dt.timezone.utc)
          at=dt.datetime.fromisoformat(d["atualizado_em"])
          if d.get("gerado_em"):
              g=dt.datetime.fromisoformat(d["gerado_em"])
              print("ATRASO DO SITE: o site no ar foi gerado ha", round((agora-g).total_seconds()/60), "min (", d["gerado_em"], ")")
          else:
              print("ATRASO DO SITE: (versao sem gerado_em; publicada antes de 23/11/2026)")
          print("Ultima noticia nova coletada ha", round((agora-at).total_seconds()/60), "min (", d["atualizado_em"], ") - de madrugada e normal ser maior")
          for n in d["noticias"][:5]: print(" ", n["d"], n["t"][:80])'
          git_ultimo=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/commits?per_page=1&sha=main" | python3 -c 'import json,sys; c=json.load(sys.stdin)[0]; print(c["commit"]["committer"]["date"], c["commit"]["message"].splitlines()[0])' || echo "(API do GitHub indisponivel)")
          echo "Ultimo commit no main: $git_ultimo"
      - name: Publicações da Vercel (tempo de cada uma)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A Vercel registra cada publicação como "deployment" no GitHub: quando foi pedida e
          # quando ficou pronta (ou foi pulada/cancelada). Mostra se há fila e quanto dura cada uma.
          python3 - <<'PY' || echo "(sem dados de publicação)"
          import json, os, urllib.request, datetime as dt
          rep = os.environ["GITHUB_REPOSITORY"]
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=20))
          def t(s): return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          agora = dt.datetime.now(dt.timezone.utc)
          for d in get(f"https://api.github.com/repos/{rep}/deployments?per_page=15"):
              st = get(d["statuses_url"] + "?per_page=10")
              ini = t(d["created_at"])
              fim = next((s for s in st if s["state"] in ("success", "failure", "error", "inactive")), None)
              estado = st[0]["state"] if st else "sem status"
              dur = f'{round((t(fim["created_at"]) - ini).total_seconds() / 60)} min' if fim else f'ainda {estado} ha {round((agora - ini).total_seconds() / 60)} min'
              print(f'{ini:%H:%M} {d["environment"][:12]:12} {d["sha"][:7]} {estado:10} {dur}')
          PY
