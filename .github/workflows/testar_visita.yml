name: Testar registro de visita (manual)
# Chama /api/visita?teste=1 no site publicado: se a chave GH_VISITA_TOKEN da Vercel funciona,
# a resposta mostra "gravacao_privada": 200 ou 201 (grava teste/ok.txt no repositório privado radar-visitas).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -w ' HTTP %{http_code}\n' -X POST -A 'Mozilla/5.0 (teste do dono)' 'https://www.radardasapreensoes.com.br/api/visita?teste=1'
