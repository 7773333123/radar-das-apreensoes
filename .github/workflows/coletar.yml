name: Atualizar noticias

on:
  workflow_dispatch:
    inputs:
      ano_historico:
        description: 'Ano historico para coleta opcional (deixe vazio para coleta normal)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar noticias
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          if [ -n "$ANO_HISTORICO" ]; then
            case "$ANO_HISTORICO" in
              2020|2021|2022|2023|2024|2025|2026|2027|2028|2029|2030) ;;
              *) echo 'Ano invalido'; exit 1 ;;
            esac
            python coletor.py --historico --ano "$ANO_HISTORICO"
          else
            python coletor.py
          fi

      - name: Instalar decodificador de links do Google Noticias
        run: |
          python -m pip install "selectolax==0.3.21" "httpx>=0.27,<1" requests beautifulsoup4 lxml
          python -m pip install --no-deps "googlenewsdecoder==0.2.1"
          python -c "from googlenewsdecoder import gnewsdecoder; print('Decodificador importado com sucesso')"

      - name: Recuperar links originais das noticias
        run: python recuperar_links.py --limite 60

      - name: Buscar fotografias das matérias originais
        run: python enriquecer_imagens.py --limite 40

      - name: Analisar noticias e gerar estatisticas
        run: python analisar_noticias.py

      - name: Salvar noticias e analise no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json analise_nacional.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar noticias e estatisticas automaticamente'
            git pull --rebase
            git push
          fi
