name: Coletar notícias e recuperar imagens
on:
  workflow_dispatch:
    inputs:
      ano_historico:
        description: 'Ano histórico opcional (vazio para coleta normal)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 10,22 * * *'
permissions:
  contents: write
concurrency:
  group: coleta-completa
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar decodificador e HTTP2
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'httpx[http2]' googlenewsdecoder
      - name: Verificar arquivos essenciais
        run: |
          test -f coletor.py
          test -f recuperar_links.py
          python -m py_compile coletor.py recuperar_links.py localizar_uf.py coletar_feeds_estaduais.py gerar_feed_site.py ler_materias.py compactar_acervo.py mesclar_acervo.py
          if [ -f coletar_fontes_diretas.py ]; then python -m py_compile coletar_fontes_diretas.py; fi
          if [ -f enriquecer_imagens.py ]; then python -m py_compile enriquecer_imagens.py; fi
      - name: Coletar notícias
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          if [ -n "$ANO_HISTORICO" ]; then
            if ! [[ "$ANO_HISTORICO" =~ ^[0-9]{4}$ ]] || [ "$ANO_HISTORICO" -lt 2006 ] || [ "$ANO_HISTORICO" -gt "$(date +%Y)" ]; then
              echo 'Ano inválido (use 2006 até o ano atual)'; exit 1
            fi
            python coletor.py --historico --ano "$ANO_HISTORICO"
          else
            python coletor.py
          fi
      - name: Coletar fontes diretas (se disponível)
        env:
          ANO_HISTORICO: ${{ inputs.ano_historico || '' }}
        run: |
          if [ -f coletar_fontes_diretas.py ]; then
            if [ -n "$ANO_HISTORICO" ]; then
              python coletar_fontes_diretas.py --ano "$ANO_HISTORICO" --paginas 2
            else
              python coletar_fontes_diretas.py --paginas 2
            fi
          else
            echo 'Coletor de fontes diretas não instalado; mantendo coleta RSS.'
          fi
      - name: Coletar feeds dos veículos (link, foto e estado)
        run: python coletar_feeds_estaduais.py
      - name: Recuperar links originais
        run: |
          python recuperar_links.py --limite 600 --trabalhadores 4 --diagnostico
      - name: Ler matérias originais (foto, resumo e texto de licença aberta)
        run: python ler_materias.py --limite 1500 --trabalhadores 8
      - name: Gerar estatísticas (se disponível)
        run: |
          if [ -f analisar_noticias.py ]; then
            python analisar_noticias.py
          else
            echo 'analisar_noticias.py não encontrado; estatísticas anteriores mantidas.'
          fi
      - name: Gerar feed enxuto do site
        run: |
          python gerar_feed_site.py
          python compactar_acervo.py
      - name: Salvar (mescla se outra coleta gravou antes)
        run: bash salvar_acervo.sh 'Atualizar notícias, links e imagens'