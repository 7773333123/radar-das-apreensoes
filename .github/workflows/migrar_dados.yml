name: Copiar acervo para a release (manual)
# Sobe o acervo e os dados do site atuais para a release "dados" e grava o
# ponteiro dados_versao.json. Usado na migração para fora do histórico do Git.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migrar-dados
  cancel-in-progress: false
jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Subir para a release e gravar o ponteiro
        run: |
          test -f noticias.json && test -f feed.json && test -d det
          python acervo.py salvar 'Copiar acervo e dados do site para a release'
          cat dados_versao.json
