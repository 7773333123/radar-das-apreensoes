name: Regenerar o site quando a regra muda
# Sempre que o gerador do site, a regra de duplicidade ou a identificação de
# estado mudam na main, o feed é regenerado na hora, sem esperar a próxima
# coleta. Assim uma correção chega ao site em 1–2 minutos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gerar_feed_site.py
      - localizar_uf.py
      - resumo_fatos.py
      - contexto.py
      - classificar.py
      - duplicatas.py
      - estatisticas.py
      - testes/**
permissions:
  contents: write
concurrency:
  group: publicar-site
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testar a regra de duplicidade
        run: python testes/test_duplicatas.py && python classificar.py
      - name: Regenerar o site de todas as partes do acervo (recente e cada ano)
        run: python acervo.py regenerar 'Regenerar o site com a regra atualizada'
