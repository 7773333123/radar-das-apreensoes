name: Coleta expressa (notícias novas a cada ~8 minutos)
# Só o caminho mais curto até o site: lê os feeds dos veículos, compara a foto das notícias novas
# (duplicatas por foto e por recorte) e publica. As etapas lentas (Google, Bing, links, leitura das
# matérias) ficam na coleta complementar (rapido.yml), que roda ao mesmo tempo em outro servidor;
# o salvar junta as duas gravações. Ciclo contínuo de ~5h20 que dispara a si mesmo no fim; o cron
# de hora em hora só reinicia o ciclo se ele cair (com concurrency, nunca roda em dobro).
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: coleta-expressa
  cancel-in-progress: false
jobs:
  expressa:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INTERVALO: 480      # segundos entre o início de cada rodada (rodada mais longa: a próxima começa logo)
      RADAR_AUDITOR_DIAS: 10
      DURACAO: 19200      # 5h20: depois disso não começa rodada nova e a execução dispara a seguinte
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --quiet googlenewsdecoder pillow numpy opencv-python-headless anthropic
      - name: Restaurar a análise das fotos recentes
        uses: actions/cache/restore@v4
        with:
          path: orb_cache2
          key: orb2-${{ github.run_id }}
          restore-keys: orb2-
      - name: Notícias novas a cada ~8 minutos
        run: |
          set -uo pipefail
          comeco=$(date +%s)
          ciclo=0
          while [ $(( $(date +%s) - comeco )) -lt "$DURACAO" ]; do
            ciclo=$((ciclo + 1))
            inicio=$(date +%s)
            echo "::group::Rodada $ciclo ($(date -u +%H:%M) UTC)"
            git fetch -q origin main && git reset -q --hard origin/main
            if python acervo.py baixar; then
              antes=$(sha1sum noticias.json | cut -c1-40)
              python coletar_feeds_estaduais.py || echo 'Feeds com falha; seguindo.'
              if [ "$(sha1sum noticias.json | cut -c1-40)" != "$antes" ]; then
                # Notícia nova sem foto ou trecho só entra no site depois de lida: lê as das últimas
                # 6 h nesta mesma rodada (antes esperavam a coleta complementar, às vezes horas).
                timeout 240 python ler_materias.py --recentes 6 --limite 80 --trabalhadores 10 --timeout 8 || true
                # A foto de cada notícia nova passa pela comparação de imagens antes de publicar.
                python hash_imagens.py --limite 300 --trabalhadores 16 --timeout 8 >/dev/null || true
                python fotos_orb.py --limite 400 --timeout 8 || true
                # Foto nova de veículo que carimba marca d'água/nome na foto: conferida antes de publicar.
                # Na entrada da notícia (24/11/2026): veículo que ainda não teve a marca aprendida é aprendido já
                # (até 6 por rodada) e a foto nova é conferida antes de ir ao site.
                timeout 200 python marcas_dagua.py --aprender --horas 3 --fontes 6 --marcar --dias 2 --limite 200 --timeout 8 || true
                # Capa = foto do material apreendido (24/11/2026): o Claude Haiku marca as fotos das notícias novas.
                timeout 240 python capas_ia.py --horas 36 --max 150 || true
                timeout 120 python revisar_titulos.py --horas 36 --max 400 || true
                if python testes/test_duplicatas.py >/dev/null; then
                  python acervo.py salvar "Coleta expressa (rodada $ciclo)" feeds_saude.json duplicatas_suspeitas.json marcas_dagua.json capas_ia.json revisao_titulos.json \
                    && gh workflow run juiz_claude.yml --ref main || echo 'Falha ao salvar; a próxima rodada tenta de novo.'
                else
                  echo 'Testes de duplicatas falharam: nada gravado nesta rodada.'
                fi
              else
                echo 'Nada novo nos feeds.'
              fi
            else
              echo 'Acervo indisponível; rodada pulada.'
            fi
            echo '::endgroup::'
            espera=$(( INTERVALO - ($(date +%s) - inicio) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done
      - name: Guardar a análise das fotos recentes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: orb_cache2
          key: orb2-${{ github.run_id }}
      - name: Continuar o ciclo
        if: success() || failure()  # cancelado à mão = o ciclo para
        run: gh workflow run expressa.yml --ref main
