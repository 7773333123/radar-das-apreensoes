name: Conferir robots.txt (manual)
on: workflow_dispatch
jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/verificar_robots.py
