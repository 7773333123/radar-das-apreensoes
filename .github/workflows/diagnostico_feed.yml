name: Diagnóstico de um feed (manual)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do feed RSS'
        required: true
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/diagnostico_feed.py "${{ inputs.url }}"
