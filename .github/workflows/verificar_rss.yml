name: Verificar RSS dos veículos (manual)
on: workflow_dispatch
jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python acervo.py baixar
      - run: python scripts/verificar_rss.py 250
      - uses: actions/upload-artifact@v4
        with:
          name: rss_verificados
          path: rss_verificados.json
